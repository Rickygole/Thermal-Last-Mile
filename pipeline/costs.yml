    blocks_direct_beam: true
    diffuse_transmission: 0.15
    legacy_value: high
    citation: PLACEHOLDER Houston Public Works shade structure unit cost
  tree:
    label: Street tree, 3 inch caliper
    unit_cost_usd: 1200
    basis: planted plus 3 year establishment
    shaded_area_m2: 28
    blocks_direct_beam: true
    diffuse_transmission: 0.30
    maturity_years: 15
    canopy_fraction_year5: 0.45
    legacy_value: high
    citation: PLACEHOLDER Houston Parks and Recreation street tree program
  awning:
    label: Bus stop awning retrofit
    unit_cost_usd: 9500
    basis: per stop
    shaded_area_m2: 18
    blocks_direct_beam: true
    diffuse_transmission: 0.10
    applies_to: wait_not_walk
    legacy_value: medium
    citation: PLACEHOLDER METRO shelter retrofit cost
  misting:
    label: Misting station
    unit_cost_usd: 6500
    basis: seasonal, plus water cost
    shaded_area_m2: 0
    blocks_direct_beam: false
    humidity_ceiling_rh: 60
    legacy_value: low
