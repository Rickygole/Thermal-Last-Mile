interventions:
  sail:
    label: Shade sail, 6 x 6 m
    unit_cost_usd: 15500
    basis: installed, 10 year service life
    shaded_area_m2: 36
    blocks_direct_beam: true
    diffuse_transmission: 0.15
    legacy_value: high
    citation: "Recreational Industries. 2025. How Much Does a Shade Canopy Cost? A Practical Guide for Schools, Parks, and Cities, 7 April 2025. Itemised 20 x 20 ft (37 m2) municipal shade structure: structure and fabric 9500 USD, freight 1200 USD, installation 3500 USD, permits and site prep 800 USD, total 15000 to 16000 USD installed. https://recreationalindustries.com/2025/04/07/how-much-does-a-shade-canopy-cost-a-practical-guide-for-schools-parks-and-cities/ . This is a commercial shade contractor cost guide, not a municipal bid tabulation. For scale, the Shade Phoenix Plan (City of Phoenix Office of Heat Response and Mitigation, approved November 2024) budgets about 3 million USD for roughly 20 architectural pedestrian shade structures at signalised intersections, which are far larger engineered canopies."
  tree:
    label: Street tree, 30 gallon, 2 inch caliper
    unit_cost_usd: 300
    basis: planted, price includes mulching, staking, fertilizing and watering at planting
    shaded_area_m2: 28
    blocks_direct_beam: true
    diffuse_transmission: 0.30
    maturity_years: 15
    canopy_fraction_year5: 0.45
    legacy_value: high
    citation: "Trees For Houston, Street Trees programme price list, accessed 2026: 30 gallon tree, 8 to 10 ft tall, 2 inch caliper, 300 USD, price includes planting, initial mulching, staking, fertilizing and one time watering at planting; 15 gallon, 1.5 inch caliper, 160 USD. https://www.treesforhouston.org/streettrees . For comparison the City of Houston Landscape Analysis Form sets the in lieu deposit to the Houston Parks and Recreation Department at 155 USD per tree, https://www.houstontx.gov/planning/Forms/devregs/tree&shrub1.pdf . This price covers planting only and does not include multi year establishment irrigation, which is why it sits well below big city figures such as the roughly 3300 USD per street tree reported for New York City."
  awning:
    label: Bus stop awning retrofit
    unit_cost_usd: 18700
    basis: per stop
    shaded_area_m2: 18
    blocks_direct_beam: true
    diffuse_transmission: 0.10
    applies_to: wait_not_walk
    legacy_value: medium
    citation: "Capital Metro (Austin, Texas) board approved shelter contract, reported in Bernier, N. 2023. Do Austin's new bus shelters cut it in the Texas heat? KUT News, 19 July 2023: up to 10.5 million USD for 562 shelters from Tolar Manufacturing over five years, which is 18683 USD per shelter. https://www.kut.org/transportation/2023-07-19/capmetro-new-bus-shelters-heat . Consistent with the Houston region, where Harris County Precinct 4 and METRO committed 6 million USD to bus stop improvements in Gulfton and Sharpstown. Jenkins, C. 2024. 20 infrastructure projects across Harris County to receive 49M in funding. Community Impact, 9 December 2024. https://communityimpact.com/houston/bellaire-meyerland-west-university/government/2024/12/09/20-infrastructure-projects-across-harris-county-to-receive-49m-in-funding/"
  misting:
    label: Misting station
    unit_cost_usd: 6500
    basis: seasonal, plus water cost
    shaded_area_m2: 0
    blocks_direct_beam: false
    humidity_ceiling_rh: 60
    legacy_value: low
    citation: "No public unit cost located for a municipal right of way misting station, figure is an order of magnitude estimate pending sourcing. The only published cost data found covers residential and light commercial systems: Angi, How Much Does an Outdoor Misting System Cost, 2026 data, average 2747 USD, typical range 1957 to 3584 USD, professional grade systems above 5000 USD, https://www.angi.com/articles/how-much-does-outdoor-misting-system-cost.htm . A public installation additionally carries a potable water connection, backflow prevention, metering and vandal resistant hardware, none of which is captured in that range."
  albedo:
    label: High albedo surface coating
    unit_cost_usd_per_m2: 10.65
    basis: coating, 7 year life
    blocks_direct_beam: false
    surface_temp_drop_c: 6.0
    reflected_load_gain_c: 1.5
    legacy_value: medium
    citation: "City of Los Angeles cool pavement programme, applied cost of 0.99 USD per square foot, which is 10.65 USD per m2, stated by Councilmember Bob Blumenfield, down from 2.50 USD per square foot at the Canoga Park pilot. Carpenter, S. 2021. North Hollywood kicks off next phase of LA cool pavement projects. Spectrum News 1, 4 October 2021. https://spectrumnews1.com/ca/la-west/environment/2021/10/04/north-hollywood-kicks-off-next-phase-of-la-cool-pavement-projects . Corroborated by the City of Phoenix Cool Pavement Program, where Street Transportation Department engineering manager Ryan Stevens gave CoolSeal at 5 USD per square yard of material and up to 14 USD per square yard applied, which is 5.98 to 16.75 USD per m2. Dalal, P. 2022. Phoenix Cool Pavement Program in phase two of finding solution to hot roads. Downtown Devil, 4 October 2022. https://downtowndevil.com/cool-pavement/"
  cooling_bus:
    label: Cooling bus
    unit_cost_usd_per_day: 2700
    basis: event only
    blocks_direct_beam: false
    legacy_value: none
    included_to_show_rejection: true
    citation: "Houston charter motorcoach day rate, midpoint of the published 1600 to 3800 USD per day range for a 54 to 56 passenger full size motorcoach. Metropolitan Shuttle, Houston Charter Bus Rental Cost, 2026 rate sheet and invoice data. https://www.metropolitanshuttle.com/charter-bus-rental-cost-houston/ . This is vendor pricing, not a municipal contract rate. No published City of Houston or METRO per day rate for heat emergency cooling buses was located; the City of Houston Heat Emergency Plan describes free rides to cooling centres but publishes no unit cost, https://www.houstontx.gov/citizensnet/2023/HeatEmergencyPlan20230614.html . Excludes staffing, water and site setup."

constants:
  wbgt_model:
    name: Liljegren
    implementation: pywbgt.liljegrenWBGT
    citation: "Liljegren, J.C. et al. 2008. Modeling the wet bulb globe temperature using standard meteorological measurements. Journal of Occupational and Environmental Hygiene 5(10) 645-655."
  wind_unit:
    value: mph
    note: the Iowa Environmental Mesonet ASOS sped field is wind speed in miles per hour, not knots. every observed value in this archive is an exact multiple of 1.15078, the knots to mph constant, which confirms the station reported integer knots and the service converted to mph. converting with the knots factor would overstate wind by 15.1 percent and bias wet bulb globe temperature low.
    citation: "Iowa Environmental Mesonet ASOS download service field documentation, sped, wind speed in miles per hour."
  asos_calm_coding:
    value: 0.772
    note: ASOS reports a wind speed of zero for any speed below about 3 knots, so a reported zero means calm rather than still air. a reported zero is imputed as the midpoint of that interval at the measurement height before the log profile is applied. the pywbgt Liljegren implementation additionally clips wind to about 1.029 metres per second internally, so the effective speed the globe budget sees is recorded separately as wind_ms_used_by_model rather than left to be inferred.
    citation: "NOAA Automated Surface Observing System user guide, wind speed reporting, calm is coded as zero below 3 knots."
  walk_speed_mps:
    value: 1.3
    citation: "Fitzpatrick, K. et al. 2006. Another look at pedestrian walking speed. Transportation Research Record 1982."
  threshold_c:
    value: 28.0
    note: >
      mirrors pipeline/config.yml walk.wbgt_threshold_c, which is the value actually read
      by the pipeline code. this entry is documentation only. the separate extreme tier used
      for fans_clear_of_extreme is pipeline/config.yml walk.wbgt_extreme_c, currently 32.0.
    citation: "ACSM and OSHA heat stress guidance, continuous exertion limit."
  diffuse_fraction_shaded:
    value: 0.19
    note: fraction of global horizontal irradiance reaching a fully shaded pedestrian
    citation: "Assumed clear sky diffuse horizontal to global horizontal ratio at the modelled solar position for Houston, approximately 0.19. This is a modelled clear sky value, not a measured site value. NSRDB was never queried by this pipeline because the NSRDB API requires a registered key that the pipeline does not hold, so any claim that this ratio was derived from NSRDB observations would be false. The 0.19 figure is consistent with the DHI to GHI ratio produced by standard clear sky models at high sun elevation, for example Ineichen, P. and Perez, R. 2002. A new airmass independent formulation for the Linke turbidity coefficient. Solar Energy 73(3) 151-157, as implemented in pvlib."
  uhi_coupling_beta:
    value: 0.2
    note: >
      daytime coupling coefficient between land surface temperature anomaly and
      near surface air temperature anomaly, applied as
      tair_cell = tair_station_interpolated + beta * (lst_cell - lst_area_mean),
      where lst_cell and lst_area_mean come from pooled Landsat Collection 2
      Level 2 ST_B10 surface temperature. Published daytime values for this
      coefficient are typically in the 0.1 to 0.3 range, 0.2 is used here as a
      representative mid range value.
    citation: "Schwarz, N., Schlink, U., Franck, U., Grossmann, K. 2012. Relationship of land surface and air temperatures and its implications for quantifying urban heat island indicators, an application for the city of Leipzig, Germany. Ecological Indicators 18, 693-704."
  ground_albedo:
    value: 0.15
    note: >
      shortwave albedo of the sunlit ground surrounding a shaded pedestrian, used to add the
      ground reflected shortwave load that a person under a shade sail or a tree still receives
      from adjacent sunlit asphalt and concrete. at the modelled clear sky global horizontal
      irradiance of about 866 W/m2 this is about 130 W/m2 of reflected shortwave. this is an
      assumed representative value for aged asphalt with some concrete and paint in the field of
      view, not a site measurement, and it sits inside the published range rather than at either
      end of it. the value used at run time is read from pipeline/config.yml under shade.ground_albedo.
    citation: "Taha, H. 1997. Urban climates and heat islands: albedo, evapotranspiration, and anthropogenic heat. Energy and Buildings 25(2) 99-103. Reports urban surface albedos with asphalt in the 0.05 to 0.20 range, fresh asphalt at the low end and weathered asphalt and mixed paved surfaces toward the upper end. Consistent with the surface albedo tables in Oke, T.R. 1987. Boundary Layer Climates, 2nd edition, Methuen, chapter 1, which give asphalt 0.05 to 0.20 and concrete 0.10 to 0.35."
  liljegren_surface_albedo:
    value: 0.45
    note: >
      not a free parameter of this project. it is the ALB_SFC constant compiled into the
      Liljegren reference C code shipped inside pywbgt, where the globe budget carries the
      shortwave term solar * (1 - ALB_GLOBE) * (fdir * (1/(2 cza) - 1) + 1 + ALB_SFC), so the
      solver already reflects 45 percent of whatever irradiance is passed in. the shaded case
      therefore divides the intended total shortwave load by (1 + 0.45) before passing it, so
      the ground reflected component is added once rather than twice. the value used at run time
      is read from pipeline/config.yml under shade.liljegren_surface_albedo.
    citation: "Value read from the source file src/liljegren_c.c distributed with pywbgt, ALB_SFC define, which implements Liljegren, J.C. et al. 2008. Modeling the wet bulb globe temperature using standard meteorological measurements. Journal of Occupational and Environmental Hygiene 5(10) 645-655. No independent publication was located that states this 0.45 figure explicitly, so it is cited as an implementation constant of the model actually being run, not as an observed surface property."
