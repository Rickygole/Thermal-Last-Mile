    basis: event only
    blocks_direct_beam: false
    legacy_value: none
    included_to_show_rejection: true
    citation: PLACEHOLDER event cooling contract rate

constants:
  wbgt_model:
    name: Liljegren
    implementation: pywbgt.liljegrenWBGT
    citation: "Liljegren, J.C. et al. 2008. Modeling the wet bulb globe temperature using standard meteorological measurements. Journal of Occupational and Environmental Hygiene 5(10) 645-655."
  walk_speed_mps:
    value: 1.3
    citation: "Fitzpatrick, K. et al. 2006. Another look at pedestrian walking speed. Transportation Research Record 1982."
  threshold_c:
    value: 32.0
    citation: "ACSM and OSHA heat stress guidance, continuous exertion limit."
  diffuse_fraction_shaded:
    value: 0.15
    note: fraction of global horizontal irradiance reaching a fully shaded pedestrian
    citation: "Derived from NSRDB DHI to GHI ratio for the match hours."
  uhi_coupling_beta:
    value: 0.2
    note: >
      daytime coupling coefficient between land surface temperature anomaly and
      near surface air temperature anomaly, applied as
      tair_cell = tair_station_interpolated + beta * (lst_cell - lst_area_mean),
      where lst_cell and lst_area_mean come from pooled Landsat Collection 2
      Level 2 ST_B10 surface temperature. Published daytime values for this
      coefficient are typically in the 0.1 to 0.3 range, 0.2 is used here as a
      representative mid range value.
    citation: "Schwarz, N., Schlink, U., Franck, U., Grossmann, K. 2012. Relationship of land surface and air temperatures and its implications for quantifying urban heat island indicators, an application for the city of Leipzig, Germany. Ecological Indicators 18, 693-704."
